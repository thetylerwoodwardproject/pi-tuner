# Pi-Tuner Low Signal alarm (RSSI). These are the defaults for every station;
# a station file can override any of them with RSSI_ALARM, RSSI_MUTE,
# RSSI_THRESHOLD_ON, RSSI_THRESHOLD_OFF, RSSI_TIME_ON, RSSI_TIME_OFF, RSSI_OFFSET.
# Changes apply within a minute, no restart needed.
# ─── user settings ─────────────────────────────────
ALARM=true  # Low Signal alarm on/off
MUTE=false  # mute the Icecast stream while the alarm is raised
THRESHOLD_ON=12  # dB: alarm raises when RSSI stays below this
THRESHOLD_OFF=18  # dB: alarm clears when RSSI stays above this
TIME_ON=60  # seconds below Threshold On before the alarm raises
TIME_OFF=5  # seconds above Threshold Off before the alarm clears
OFFSET=0  # dB added to the reading, to line it up with another meter
# ─── end user settings ─────────────────────────────
