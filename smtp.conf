# Pi-Tuner — SMTP email alerts
# tuner.py emails you when a station goes down (and when it recovers), when the
# EAS attention tone is heard, when recording disk space runs low, and when the
# service starts or stops. Set ENABLED=true and fill in HOST and TO, then check
# it with:  sudo python3 /opt/pituner/tuner.py test-email --dir /opt/pituner
#
# This file holds your SMTP password: keep it mode 600 and owned by pituner.
#
# ─── user settings ─────────────────────────────────
ENABLED=false
HOST=smtp.example.com
PORT=587
# starttls (usually port 587), ssl (usually port 465) or none (internal relay)
SECURITY=starttls
# Set false only for an internal relay with a self-signed certificate
VERIFY_TLS=true
# Leave USERNAME blank if the server needs no login. If the password contains " #",
# wrap it in double quotes: PASSWORD="my pass #1"
USERNAME=
PASSWORD=
FROM=pituner@example.com
# One or more addresses, separated by commas
TO=you@example.com
SUBJECT_PREFIX=[Pi-Tuner]
# Seconds to wait on the SMTP server
TIMEOUT=10
# Which emails to send
ALERT_STATION=true
ALERT_EAS=true
ALERT_DISK=true
ALERT_SERVICE=true
# A station must stay down this many seconds before the "down" email is sent
DOWN_DELAY=120
# Email when free space under /opt/pituner drops below this (only when a station records)
DISK_MIN_GB=2
# ─── end user settings ─────────────────────────────
