# Pi-Tuner station — add a new station by dropping a new *.conf file here.
#
# ─── user settings ─────────────────────────────────
NAME=Station VYMXC
BAND=fm            # fm | wx
FREQUENCY=103.4
SERIAL=00001001
GAIN=40.2          # dB; delete this line for auto-gain
RBDS=true          # decode RBDS; RadioText + station name -> Icecast now-playing
# MOUNT=/tuner1    # optional; defaults to /tuner1, /tuner2, ... in file order
# RSSI_MONITOR=false    # optional: reception (RSSI) is measured every minute; false turns it off
# RSSI_THRESHOLD_ON=10   # optional: override the Low Signal alarm settings from rssi.conf for this station
# RSSI_THRESHOLD_OFF=16  #   (also RSSI_ALARM, RSSI_MUTE, RSSI_TIME_ON, RSSI_TIME_OFF, RSSI_OFFSET)
# RECORD=true            # optional: record to /opt/pituner/recordings in 15-minute MP3 files
# RECORD_KEEP_DAYS=14    # optional: delete recordings older than this (omit to keep all)
# ─── end user settings ─────────────────────────────
