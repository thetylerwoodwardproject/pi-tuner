# Pi-Tuner — syslog output for Graylog (RFC 5424, UDP or TCP)
# Everything that goes to Zabbix (events, EAS tones, station state, audio level,
# RSSI, RBDS text, the heartbeat snapshot) is also sent here as one syslog
# message per item. In Graylog create a "Syslog UDP" (or "Syslog TCP") input,
# then set ENABLED=true and point SERVER at it. Test with:
#   sudo python3 /opt/pituner/tuner.py test-syslog --dir /opt/pituner
#
# Each message carries searchable structured-data fields: key, value, and for
# per-tuner items tuner and metric. Events (key pituner.event) are the message
# text; other items read "key=value". Station down / no_audio / EAS / stopped
# events go out at severity "warning", everything else at "info".
#
# The EAS_DETECT, LEVEL_MONITOR, RSSI_MONITOR and INTERVAL settings in
# zabbix.conf also control what is sent here, and they apply even when Zabbix
# itself is not enabled.
#
# ─── user settings ─────────────────────────────────
ENABLED=false
SERVER=graylog.internal.example.com
PORT=514
# udp or tcp; must match the Graylog input (TCP is newline-delimited)
PROTOCOL=udp
# local0-local7, daemon, user, ...
FACILITY=local0
APP_NAME=pituner
# Source host name on each message; blank uses this machine's name
HOSTNAME=
# ─── end user settings ─────────────────────────────
