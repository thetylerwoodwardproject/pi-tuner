# Pi-Tuner — Zabbix trapper (zabbix_sender protocol)
# tuner.py pushes events, a periodic status snapshot and per-tuner items (state,
# frequency, RBDS text, audio level, ...) to a Zabbix server over TCP port 10051. Set ENABLED=true and point SERVER at your
# internal Zabbix server. Import zabbix_template.xml there first.
#
# ─── user settings ─────────────────────────────────
ENABLED=false
SERVER=zabbix.internal.example.com
PORT=10051
HOSTNAME=pituner
# Global item keys. Per-tuner items (pituner.tuner.*[tunerN]) are discovered
# automatically from your stations. Must match the imported zabbix_template.xml
KEY_EVENT=pituner.event
KEY_ACTIVE=pituner.stations_active
KEY_HEARTBEAT=pituner.heartbeat
KEY_EAS=pituner.eas
# Status snapshot interval, seconds (also acts as the liveness heartbeat)
INTERVAL=60
# Detect the EAS/SAME attention tone (853+960 Hz) on FM/WX stations and pulse
# pituner.eas (1 for ~10 s, then back to 0) so Zabbix can trigger on it.
EAS_DETECT=true
# Send each tuner's audio level (dBFS) so Zabbix can alert on dead air.
LEVEL_MONITOR=true
# Send each tuner's peak deviation (kHz) and modulation (%). 100% modulation is
# 75 kHz on FM and about 5 kHz on NOAA Weather Radio; change them if you need to.
DEVIATION_MONITOR=true
FM_FULL_DEVIATION_KHZ=75
WX_FULL_DEVIATION_KHZ=5
# ─── end user settings ─────────────────────────────
