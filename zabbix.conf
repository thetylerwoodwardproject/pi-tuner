# Pi Tuner v2 — Zabbix trapper (zabbix_sender protocol)
# tuner.py pushes station events and a periodic status snapshot to a Zabbix
# server over TCP port 10051. Set ENABLED=true and point SERVER at your
# internal Zabbix server. Import zabbix_template.xml there first.
#
# ─── user settings ─────────────────────────────────
ENABLED=false
SERVER=zabbix.internal.example.com
PORT=10051
HOSTNAME=pituner
# Item keys — must match the imported zabbix_template.xml
KEY_EVENT=pituner.event
KEY_STATUS=pituner.status
KEY_ACTIVE=pituner.stations_active
KEY_HEARTBEAT=pituner.heartbeat
KEY_EAS=pituner.eas
# Status snapshot interval, seconds (also acts as the liveness heartbeat)
INTERVAL=60
# Detect the EAS/SAME attention tone (853+960 Hz) on FM/WX stations and pulse
# pituner.eas (1 for ~10 s, then back to 0) so Zabbix can trigger on it.
EAS_DETECT=true
# ─── end user settings ─────────────────────────────
